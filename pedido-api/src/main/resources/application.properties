server.port=8083
spring.application.name=pedido-api

# H2 Database configuration for dev
spring.datasource.url=jdbc:h2:mem:pedidodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# H2 Console

# Endpoints de otros microservicios (para usar con RestClient)
api.producto.url=http://localhost:8080/api/productos
api.inventario.url=http://localhost:8081/api/inventarios
api.usuario.url=http://localhost:8082/api/usuarios

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
seguridad.jwt.secret=secretsecretsecretsecretsecretsecretsecretsecret

# Observability
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
