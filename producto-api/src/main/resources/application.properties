spring.application.name=producto-api

# URL de la base de datos (la necesitamos siempre, en cualquier ambiente)
spring.datasource.url=jdbc:h2:mem:productodb

# Evita el warning de open-in-view
spring.jpa.open-in-view=false

# Le decimos a Spring que por defecto use el perfil de desarrollo
spring.profiles.default=dev

# Tamaño máximo de página que un cliente puede pedir (si pide más, se recorta a 50)
spring.data.web.pageable.max-page-size=50

server.port=8080


spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
seguridad.jwt.secret=${JWT_SECRET:d1f2g3h4j5k6l7m8n9q0w1e2r3t4y5u6i7o8p9z0x1c2v3b4n5m6_desarrollo_local}

# Observability
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
outbox.lock-min=PT4S
outbox.lock-max=PT14M

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
