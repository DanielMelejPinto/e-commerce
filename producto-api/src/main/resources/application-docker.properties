# ==========================================
# Perfil Docker: conecta con PostgreSQL
# Activar con: -Dspring-boot.run.profiles=docker
# ==========================================

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:productodb}
spring.datasource.username=${POSTGRES_USER:producto}
spring.datasource.password=${POSTGRES_PASSWORD}

# Crea/actualiza las tablas automáticamente según las entidades
spring.jpa.hibernate.ddl-auto=update
