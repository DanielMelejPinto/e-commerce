services:
  db:
    image: postgres:17
    container_name: producto-db
    environment:
      # Docker Compose lee estas variables del archivo .envls -la docker-compose.yml
      
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Solo accesible desde tu propia máquina
      - "127.0.0.1:5432:5432"
    volumes:
      # Volumen con nombre: los datos sobreviven aunque borres el contenedor
      - producto-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  producto-data: