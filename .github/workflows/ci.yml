name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        module: [ producto-api, inventario-api ]
      fail-fast: false
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        
    - name: Build and test ${{ matrix.module }}
      working-directory: ./${{ matrix.module }}
      run: |
        chmod +x mvnw
        ./mvnw -B verify
