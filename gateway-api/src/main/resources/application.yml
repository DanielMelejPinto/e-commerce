server:
  port: 8000

spring:
  application:
    name: gateway-api
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: producto-api
          uri: http://localhost:8080
          predicates:
            - Path=/api/productos/**
        - id: inventario-api
          uri: http://localhost:8081
          predicates:
            - Path=/api/inventarios/**
        - id: usuario-api
          uri: http://localhost:8082
          predicates:
            - Path=/api/usuarios/**, /api/auth/**
        - id: pedido-api
          uri: http://localhost:8083
          predicates:
            - Path=/api/pedidos/**

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
