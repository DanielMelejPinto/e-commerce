server:
  port: 8000

spring:
  application:
    name: gateway-api
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webflux:
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
          routes:
            - id: producto-api
              uri: ${PRODUCTO_URL:http://localhost:8080}
              predicates:
                - Path=/api/productos/**
            - id: inventario-api
              uri: ${INVENTARIO_URL:http://localhost:8081}
              predicates:
                - Path=/api/inventarios/**
            - id: usuario-api
              uri: ${USUARIO_URL:http://localhost:8082}
              predicates:
                - Path=/api/usuarios/**, /api/auth/**
            - id: pedido-api
              uri: ${PEDIDO_URL:http://localhost:8083}
              predicates:
                - Path=/api/pedidos/**

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    "[org.hibernate.validator.internal.metadata.aggregated.CascadingMetaDataBuilder]": ERROR
