spring.application.name=usuario-api
server.port=8082

spring.datasource.url=jdbc:h2:mem:usuariodb
spring.jpa.open-in-view=false
spring.profiles.default=dev

# Costo de BCrypt: cada +1 duplica el tiempo (12 ≈ 250 ms por hash en un portátil)
seguridad.bcrypt-cost=12

# La clave secreta debe tener mínimo 32 caracteres para ser segura en HMAC-SHA256
seguridad.jwt.secret=MiClaveSuperSecretaParaElEcommerceDeDaniel2026!
# Tiempo de expiración del token (86400000 ms = 1 día)
seguridad.jwt.expiration-ms=86400000