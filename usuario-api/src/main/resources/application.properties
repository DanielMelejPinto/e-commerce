spring.application.name=usuario-api
server.port=8082

spring.datasource.url=jdbc:h2:mem:usuariodb
spring.jpa.open-in-view=false
spring.profiles.default=dev

# Costo de BCrypt: cada +1 duplica el tiempo (12 ≈ 250 ms por hash en un portátil)
seguridad.bcrypt-cost=12

# Lee la variable de entorno JWT_SECRET. Si no existe, usa la clave por defecto (solo para pruebas locales)
seguridad.jwt.secret=${JWT_SECRET:d1f2g3h4j5k6l7m8n9q0w1e2r3t4y5u6i7o8p9z0x1c2v3b4n5m6_desarrollo_local}

# Tiempo de expiración del token (86400000 ms = 1 día)

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
